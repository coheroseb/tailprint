<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tpGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Dark card container -->
  <rect width="600" height="240" rx="28" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="598" height="238" rx="27" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radial grid pattern -->
  <g opacity="0.15">
    <circle cx="300" cy="120" r="80" stroke="#818cf8" stroke-dasharray="4 6"/>
    <circle cx="300" cy="120" r="140" stroke="#818cf8" stroke-dasharray="4 6"/>
  </g>

  <!-- Ambient light blobs behind text -->
  <circle cx="220" cy="120" r="45" fill="#818cf8" opacity="0.18" filter="url(#ambientGlow)"/>
  <circle cx="380" cy="120" r="45" fill="#f472b6" opacity="0.18" filter="url(#ambientGlow)"/>

  <!-- Centered Logo Group -->
  <g transform="translate(130, 85)">
    <!-- Opening Bracket < -->
    <text x="0" y="50" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="46" font-weight="800" fill="#818cf8">&lt;</text>
    
    <!-- tail -->
    <text x="34" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5" fill="#ffffff">tail</text>
    
    <!-- print -->
    <text x="122" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5" fill="url(#tpGradDark)">print</text>
    
    <!-- Closing Bracket /> -->
    <text x="254" y="50" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="46" font-weight="800" fill="#f472b6">/&gt;</text>
  </g>
</svg>
