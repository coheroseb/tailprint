<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tpGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#c084fc" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#subtleGlow)">
    <!-- Opening Bracket < -->
    <text x="12" y="50" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="44" font-weight="800" fill="#818cf8">&lt;</text>
    
    <!-- tail -->
    <text x="44" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5" fill="#ffffff">tail</text>
    
    <!-- print -->
    <text x="128" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5" fill="url(#tpGradient)">print</text>
    
    <!-- Closing Bracket /> -->
    <text x="254" y="50" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="44" font-weight="800" fill="#f472b6">/&gt;</text>
  </g>
</svg>
