<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tpGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="56" y1="24" x2="44" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glowDot" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f43f5e" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="100" height="100" rx="24" fill="#090d16"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="23.5" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Outer Print Crop Corner Marks -->
  <path d="M14 24 L14 14 L24 14" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M86 24 L86 14 L76 14" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 76 L14 86 L24 86" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M86 76 L86 86 L76 86" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Code Brackets < and > -->
  <path d="M35 28 L23 50 L35 72" stroke="url(#tpGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M65 28 L77 50 L65 72" stroke="url(#tpGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Precision Laser Slash / Print Beam -->
  <line x1="56" y1="26" x2="44" y2="74" stroke="url(#laserGrad)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Center Registration / Print Target Dot -->
  <circle cx="50" cy="50" r="3.5" fill="#f43f5e" filter="url(#glowDot)"/>
</svg>
